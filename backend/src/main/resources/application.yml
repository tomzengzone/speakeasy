spring:
  application:
    name: speakeasy-backend
  datasource:
    url: ${SPEAKEASY_DB_URL:jdbc:postgresql://localhost:5432/speakeasy}
    username: ${SPEAKEASY_DB_USERNAME:speakeasy}
    password: ${SPEAKEASY_DB_PASSWORD:speakeasy}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
  data:
    redis:
      url: ${SPEAKEASY_REDIS_URL:redis://localhost:6379}
      repositories:
        enabled: false

server:
  servlet:
    context-path: /v1

speakeasy:
  auth:
    access-token-ttl: ${SPEAKEASY_AUTH_ACCESS_TOKEN_TTL:15m}
    session-idle-ttl: ${SPEAKEASY_AUTH_SESSION_IDLE_TTL:30d}
    session-absolute-ttl: ${SPEAKEASY_AUTH_SESSION_ABSOLUTE_TTL:90d}
    client-id: ${SPEAKEASY_AUTH_CLIENT_ID:speakeasy-mobile}
    audience: ${SPEAKEASY_AUTH_AUDIENCE:speakeasy-api}
    authorized-scopes: "${SPEAKEASY_AUTH_AUTHORIZED_SCOPES:ai:use course:read learning:read learning:write session:manage user:read user:write}"
    providers:
      mode: ${SPEAKEASY_AUTH_PROVIDER_MODE:disabled}
      deterministic-enabled: false
      timeout: ${SPEAKEASY_AUTH_PROVIDER_TIMEOUT:5s}
      phone:
        request-url: ${SPEAKEASY_PHONE_CODE_REQUEST_URL:}
        verify-url: ${SPEAKEASY_PHONE_CODE_VERIFY_URL:}
        bearer-token: ${SPEAKEASY_PHONE_VERIFICATION_TOKEN:}
      apple:
        client-id: ${SPEAKEASY_APPLE_CLIENT_ID:}
        issuer: https://appleid.apple.com
        jwk-set-uri: https://appleid.apple.com/auth/keys
      wechat:
        app-id: ${SPEAKEASY_WECHAT_APP_ID:}
        app-secret: ${SPEAKEASY_WECHAT_APP_SECRET:}
        token-url: https://api.weixin.qq.com/sns/oauth2/access_token
    rate-limit:
      mode: ${SPEAKEASY_AUTH_RATE_LIMIT_MODE:disabled}
      key-secret: ${SPEAKEASY_AUTH_RATE_LIMIT_KEY_SECRET:}
      trusted-proxy-cidrs: ${SPEAKEASY_AUTH_TRUSTED_PROXY_CIDRS:}
      max-retry-after: 300s
      unavailable-retry-after: 5s
      audit-dedup-window: 15m
      policies:
        phone-login:
          network: { capacity: 30, refill-tokens: 1, refill-period: 2s }
          device: { capacity: 10, refill-tokens: 1, refill-period: 60s }
          account: { capacity: 5, refill-tokens: 1, refill-period: 120s }
        apple-login:
          network: { capacity: 60, refill-tokens: 1, refill-period: 1s }
          device: { capacity: 15, refill-tokens: 1, refill-period: 30s }
          credential: { capacity: 5, refill-tokens: 1, refill-period: 60s }
          account: { capacity: 10, refill-tokens: 1, refill-period: 60s }
        wechat-login:
          network: { capacity: 60, refill-tokens: 1, refill-period: 1s }
          device: { capacity: 15, refill-tokens: 1, refill-period: 30s }
          credential: { capacity: 5, refill-tokens: 1, refill-period: 60s }
          account: { capacity: 10, refill-tokens: 1, refill-period: 60s }
        refresh:
          network: { capacity: 120, refill-tokens: 2, refill-period: 1s }
          device: { capacity: 12, refill-tokens: 1, refill-period: 10s }
          credential: { capacity: 5, refill-tokens: 1, refill-period: 30s }
          account: { capacity: 30, refill-tokens: 1, refill-period: 5s }
          family: { capacity: 6, refill-tokens: 1, refill-period: 30s }
        session-management:
          network: { capacity: 120, refill-tokens: 2, refill-period: 1s }
          session: { capacity: 30, refill-tokens: 1, refill-period: 2s }
          account: { capacity: 60, refill-tokens: 1, refill-period: 1s }
        phone-code-request:
          network: { capacity: 20, refill-tokens: 1, refill-period: 3s }
          device: { capacity: 5, refill-tokens: 1, refill-period: 120s }
          account: { capacity: 3, refill-tokens: 1, refill-period: 300s }
  ops:
    principal-id: ${SPEAKEASY_OPS_PRINCIPAL_ID:shared-ops-token}
  content:
    course-read:
      enabled: ${SPEAKEASY_CONTENT_COURSE_READ_ENABLED:true}
  goal-autopilot:
    runtime:
      enabled: ${SPEAKEASY_GOAL_AUTOPILOT_RUNTIME_ENABLED:true}
      kill-switch:
        enabled: ${SPEAKEASY_GOAL_AUTOPILOT_KILL_SWITCH_ENABLED:false}
        reason: ${SPEAKEASY_GOAL_AUTOPILOT_KILL_SWITCH_REASON:operator_disabled}
  ai:
    provider: ${SPEAKEASY_AI_PROVIDER:deterministic}
    media:
      metadata-signing-key: ${SPEAKEASY_MEDIA_METADATA_SIGNING_KEY:}
      allow-unsigned-head-metadata: ${SPEAKEASY_MEDIA_ALLOW_UNSIGNED_HEAD_METADATA:false}
      duration-header: ${SPEAKEASY_MEDIA_DURATION_HEADER:X-Speakeasy-Audio-Duration-Seconds}
      metadata-timeout: ${SPEAKEASY_MEDIA_METADATA_TIMEOUT:5s}
      public-base-url: ${SPEAKEASY_MEDIA_PUBLIC_BASE_URL:https://media.speakeasy.local/audio}
      upload-base-url: ${SPEAKEASY_MEDIA_UPLOAD_BASE_URL:https://upload.speakeasy.local/audio}
      upload-ttl: ${SPEAKEASY_MEDIA_UPLOAD_TTL:15m}
      provider-read-ttl: ${SPEAKEASY_MEDIA_PROVIDER_READ_TTL:10m}
      tts-cache-ttl: ${SPEAKEASY_TTS_CACHE_TTL:7d}
      max-upload-bytes: ${SPEAKEASY_MEDIA_MAX_UPLOAD_BYTES:10000000}
      max-upload-duration-seconds: ${SPEAKEASY_MEDIA_MAX_UPLOAD_DURATION_SECONDS:120}
      storage-provider: ${SPEAKEASY_MEDIA_STORAGE_PROVIDER:local}
      oss-endpoint: ${ALIYUN_OSS_ENDPOINT:}
      oss-bucket: ${ALIYUN_OSS_BUCKET:}
      oss-access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
      oss-access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
      oss-object-prefix: ${ALIYUN_OSS_OBJECT_PREFIX:audio/uploads}
      oss-server-side-encryption: ${ALIYUN_OSS_SERVER_SIDE_ENCRYPTION:}
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      compatible-base-url: ${DASHSCOPE_COMPATIBLE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-base-url: ${DASHSCOPE_API_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
      llm-model: ${DASHSCOPE_LLM_MODEL:qwen-plus}
      tts-url: ${DASHSCOPE_TTS_URL:https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation}
      tts-model: ${DASHSCOPE_TTS_MODEL:qwen3-tts-flash}
      tts-voice: ${DASHSCOPE_TTS_VOICE:Cherry}
      asr-model: ${DASHSCOPE_ASR_MODEL:paraformer-v2}
      max-text-chars: ${DASHSCOPE_MAX_TEXT_CHARS:1200}
      max-asr-duration-seconds: ${DASHSCOPE_MAX_ASR_DURATION_SECONDS:120}
      max-asr-bytes: ${DASHSCOPE_MAX_ASR_BYTES:10000000}
      asr-poll-attempts: ${DASHSCOPE_ASR_POLL_ATTEMPTS:6}
      request-timeout: ${DASHSCOPE_REQUEST_TIMEOUT:20s}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
